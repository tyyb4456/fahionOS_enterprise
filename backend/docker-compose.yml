# ═══════════════════════════════════════════════════════════════════════════════
# FashionOS — Local Development Stack
# ═══════════════════════════════════════════════════════════════════════════════
# Ports:
#   5432  → PostgreSQL
#   6379  → Redis
#   8000  → ChromaDB
#   8001  → shopify-mcp
#   8002  → meta-mcp
#   8003  → research-mcp
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── INFRASTRUCTURE ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: fashionos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fashionos
      POSTGRES_USER:     fashionos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashionos_dev}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashionos -d fashionos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: fashionos_redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --appendfsync everysec
                   --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: fashionos_chroma
    restart: unless-stopped
    volumes: [chroma_data:/data]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── MCP SERVERS ──────────────────────────────────────────────────────────────

  shopify-mcp:
    build: { context: ./mcp_servers/shopify_server, dockerfile: Dockerfile }
    container_name: fashionos_shopify_mcp
    restart: unless-stopped
    env_file: ./mcp_servers/shopify_server/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys;s=socket.socket();s.settimeout(3);s.connect(('localhost',8001));s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  meta-mcp:
    build: { context: ./mcp_servers/meta_server, dockerfile: Dockerfile }
    container_name: fashionos_meta_mcp
    restart: unless-stopped
    env_file: ./mcp_servers/meta_server/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys;s=socket.socket();s.settimeout(3);s.connect(('localhost',8002));s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  research-mcp:
    build: { context: ./mcp_servers/research_server, dockerfile: Dockerfile }
    container_name: fashionos_research_mcp
    restart: unless-stopped
    env_file: ./mcp_servers/research_server/.env
    # No REDIS_URL — research-mcp doesn't read per-brand credentials (public
    # web data only, no brand_id-scoped auth), unlike shopify-mcp/meta-mcp.
    ports: ["8003:8003"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys;s=socket.socket();s.settimeout(3);s.connect(('localhost',8003));s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  chroma_data:

networks:
  default:
    name: fashionos_net
    driver: bridge